# ===============================
# TARE Planner - robocup 场景配置
# 适用场景：小尺度室内迷宫、窄通道、连续转角、入口较窄
# 当前目标：尽量避免在窄道入口附近过早判探索完成，同时降低入口左右抖动
# ===============================

# ----------- 话题接口（订阅）-----------
# 外部启动探索指令
sub_start_exploration_topic_ : /start_exploration
# 近场地形图
sub_terrain_map_topic_ : /terrain_map
# 远场/扩展地形图
sub_terrain_map_ext_topic_ : /terrain_map_ext
# 与扫描时刻对齐的状态估计
sub_state_estimation_topic_ : /state_estimation_at_scan
# 已配准点云
sub_registered_scan_topic_ : /registered_scan
# 覆盖边界
sub_coverage_boundary_topic_ : /sensor_coverage_planner/coverage_boundary
# 视点/导航边界
sub_viewpoint_boundary_topic_ : /navigation_boundary
# 禁入区域边界
sub_nogo_boundary_topic_ : /sensor_coverage_planner/nogo_boundary
# 手柄输入
sub_joystick_topic_ : /joy
# 外部复位 waypoint 指令
sub_reset_waypoint_topic_ : /reset_waypoint

# ----------- 话题接口（发布）-----------
# 探索完成标志
pub_exploration_finish_topic_ : exploration_finish
# 各模块运行时统计
pub_runtime_breakdown_topic_ : runtime_breakdown
# 总运行时间
pub_runtime_topic_ : /runtime
# 输出给 local_planner 的导航目标点
pub_waypoint_topic_ : /way_point
# 动量模式触发次数
pub_momentum_activation_count_topic_ : momentum_activation_count
# 卡死脱困模式标志
pub_stuck_recovery_mode_topic_ : /stuck_recovery_mode

# ===============================
# 行为开关与核心阈值
# ===============================
# 启动后自动开始探索
kAutoStart : true
# 探索尾声是否快速回家
kRushHome : true
# robocup 平面迷宫场景下不依赖地形高度给视点抬高
kUseTerrainHeight : false
# 保留地形碰撞检查，避免窄道内误穿墙
kCheckTerrainCollision : true
# 是否对最终 waypoint 做前向外延
kExtendWayPoint : true
# 当前场景关闭“仅视线内前瞻点”策略，避免窄口频繁卡在入口
kUseLineOfSightLookAheadPoint : false
# 不允许“没有探索直接回家”的退化策略
kNoExplorationReturnHome : true

# waypoint 外延距离（较大 / 较小）
# 当前值适度上调，增强丁字路口/分叉口已选方向的延续性
kExtendWayPointDistanceBig : 2.5
kExtendWayPointDistanceSmall : 1.0

# 关键位姿点云降采样体素大小
kKeyposeCloudDwzFilterLeafSize : 0.2

# 回家距离阈值
kRushHomeDist : 2.5
# 到家判定阈值
kAtHomeDistThreshold : 0.5
# 地形点被视作碰撞障碍的强度阈值
kTerrainCollisionThreshold : 0.5
# 全局/局部前瞻距离
# 当前值适度上调，减少路口前过早重选局部分支
kLookAheadDistance : 3.5
# 只要旧 lookahead 仍在规划域内且距离还够，就优先沿当前已选分支继续推进
kLookAheadKeepMinDistance : 0.8
# 候选新分支必须比当前分支明显更优，才允许在路口重新切边
kLookAheadSwitchScoreMargin : 0.12
# 检测到“似乎该回家了”后，至少连续这么多轮都为空，才正式进入回家状态
kReturnHomeCandidateCountThreshold : 8

# 是否启用动量模式（避免方向频繁切换）
kUseMomentum : true
# 触发动量模式的方向切换次数阈值
kDirectionChangeCounterThr : 2
# 退出动量模式的连续稳定次数阈值
kDirectionNoChangeCounterThr : 8
# 是否启用“分支探完后前进式回撤”和卡住自动脱困
kEnableBranchRecovery : true
# 视点图中邻接数达到该值时，认为当前位置附近可能是一个可回退的分叉锚点
kBranchCandidateDegreeThreshold : 3
# 两个分叉锚点之间的最小间距
kBranchAnchorMinSeparation : 1.0
# 认为已经回到分叉锚点的距离阈值
kRecoveryAnchorReachedDist : 0.6
# 若连续多轮位移低于该阈值，则累计为“疑似卡住”
kRecoveryProgressMinDist : 0.15
# 连续多少轮低进展后触发自动脱困
kStuckCycleThreshold : 4
# 前进式回撤时，最多向后回看多少个 breadcrumb 作为局部子目标候选
kRecoveryBreadcrumbLookback : 12
# 回撤子目标的最大直线距离，过大容易重新把目标放到身后
kRecoveryWaypointMaxDistance : 1.2
# 回撤子目标相对车头方向允许的最小点积；放宽到允许轻微后向，供卡死时短距离脱困
kRecoveryWaypointMinDot : -0.75

# 手柄用于 reset waypoint 的轴编号
kResetWaypointJoystickAxesID : 2


# ===============================
# PlanningEnv（前沿与目标生成）
# ===============================
# 是否使用 frontier 驱动探索
kUseFrontier : true
# frontier 聚类距离阈值
kFrontierClusterTolerance : 0.8
# frontier 最小簇点数
# 对同类小尺度多回环地图保留更小的 frontier，避免窄口后方区域过早被当作完成
kFrontierClusterMinSize : 3
# 是否使用 coverage 边界过滤 frontier
kUseCoverageBoundaryOnFrontier : false
# 是否使用 coverage 边界过滤物体表面
kUseCoverageBoundaryOnObjectSurface : false


# ===============================
# Rolling Occupancy Grid（滚动占据栅格）
# ===============================
# 占据栅格分辨率
# 当前值比常规室内更细，用于保留窄道入口附近的细节
rolling_occupancy_grid/resolution_x : 0.15
rolling_occupancy_grid/resolution_y : 0.15
rolling_occupancy_grid/resolution_z : 0.15

# 点云表面降采样分辨率
kSurfaceCloudDwzLeafSize : 0.15
# 碰撞点云降采样分辨率
kCollisionCloudDwzLeafSize : 0.12
# 关键位姿点云栈数量
kKeyposeCloudStackNum : 5
# 点云管理器网格尺寸（行/列/层）
kPointCloudRowNum : 40
kPointCloudColNum : 40
kPointCloudLevelNum : 20
# 单个格子最大点数
kMaxCellPointNum : 100000
# 点云管理器单元尺寸
kPointCloudCellSize : 12
# 点云管理器单元高度
kPointCloudCellHeight : 1.8
# 邻域单元数量
kPointCloudManagerNeighborCellNum : 5
# 覆盖判定时的 Z 方向压缩比例
kCoverCloudZSqueezeRatio : 2.0


# ===============================
# KeyposeGraph（关键位姿图）
# ===============================
# 新增关键位姿最小距离
keypose_graph/kAddNodeMinDist : 0.5
# 新增非关键关键位姿节点最小距离
keypose_graph/kAddNonKeyposeNodeMinDist : 0.25
# 图中新增连边距离阈值
keypose_graph/kAddEdgeConnectDistThr : 1.5
# 与上一个关键位姿连边距离阈值
keypose_graph/kAddEdgeToLastKeyposeDistThr : 1.5
# 允许连边的垂直高度差阈值
keypose_graph/kAddEdgeVerticalThreshold : 0.8
# 连边碰撞检查分辨率
keypose_graph/kAddEdgeCollisionCheckResolution : 0.2
# 连边碰撞检查半径
keypose_graph/kAddEdgeCollisionCheckRadius : 0.25
# 判定连边被阻塞所需的最小碰撞点数
keypose_graph/kAddEdgeCollisionCheckPointNumThr : 1


# ===============================
# ViewPointManager（视点采样与局部路径）
# ===============================
# 视点网格数量
# 当前场景专门加密，尽量让窄道入口内外都能找到候选点
viewpoint_manager/number_x : 48
viewpoint_manager/number_y : 48
viewpoint_manager/number_z : 1
# 视点网格分辨率
viewpoint_manager/resolution_x : 0.35
viewpoint_manager/resolution_y : 0.35
viewpoint_manager/resolution_z : 0.0

# 连通性高度差阈值
kConnectivityHeightDiffThr : 0.2
# greedy 选点时的候选采样范围
kGreedyViewPointSampleRange : 1
# 局部路径优化最大迭代次数
kLocalPathOptimizationItrMax : 4

# 视点碰撞边界
# 当前值已减小，避免 1 米级窄道入口附近没有任何可用视点
kViewPointCollisionMargin : 0.22
kViewPointCollisionMarginZPlus : 0.25
kViewPointCollisionMarginZMinus : 0.25

# 视点碰撞栅格参数
kCollisionGridZScale : 1.0
kCollisionGridResolutionX : 0.12
kCollisionGridResolutionY : 0.12
kCollisionGridResolutionZ : 0.0
# 一个视点被视为碰撞所需的最少碰撞点数
kCollisionPointThr : 1

# 碰到障碍时是否在最近障碍处截断 LOS
kLineOfSightStopAtNearestObstacle : false
# 视点相对地形抬高高度
kViewPointHeightFromTerrain : 0.65
# 视点高度发生重置的阈值
kViewPointHeightFromTerrainChangeThreshold : 0.4
# 是否检查动态障碍物碰撞
kCheckDynamicObstacleCollision : false
# 连续多少帧碰撞后才将该视点稳定判为碰撞
kCollisionFrameCountMax : 3

# 传感器覆盖模型参数
kSensorRange : 5.5
kNeighborRange : 2.2
kCoverageOcclusionThr : 0.25
# 略微增大已覆盖区域膨胀，减少墙边零碎残留点反复诱导贴墙补扫
kCoverageDilationRadius : 0.18


# ===============================
# Grid World（全局离散子空间）
# ===============================
kGridWorldXNum : 121
kGridWorldYNum : 121
kGridWorldZNum : 121
kGridWorldCellHeight : 3.0
kGridWorldNearbyGridNum : 5

# 单个视点至少需要新增多少覆盖点才算有价值
# 当前值进一步下调，避免弱新增信息区域在第二个回环前被过早判成无价值
kMinAddPointNumSmall : 10
kMinAddPointNumBig : 18
# 保留更小 frontier，提升跨回环切换能力
kMinAddFrontierPointNum : 2

# 子空间状态切换阈值
# 当前值偏低，目的是让入口附近 cell 更容易重新进入 exploring
kCellExploringToCoveredThr : 1
# 从 2 略升到 3，降低已覆盖 cell 因微小 frontier 波动反复抖动重开的概率
kCellCoveredToExploringThr: 3
kCellExploringToAlmostCoveredThr: 3
kCellAlmostCoveredToExploringThr: 5
kCellUnknownToExploringThr: 1


# ===============================
# Visualization（可视化）
# ===============================
kExploringSubspaceMarkerColorGradientAlpha : true
kExploringSubspaceMarkerColorMaxAlpha : 0.8
kExploringSubspaceMarkerColorR : 0.0
kExploringSubspaceMarkerColorG : 1.0
kExploringSubspaceMarkerColorB : 0.0
kExploringSubspaceMarkerColorA : 1.0
kLocalPlanningHorizonMarkerColorR : 0.0
kLocalPlanningHorizonMarkerColorG : 1.0
kLocalPlanningHorizonMarkerColorB : 0.0
kLocalPlanningHorizonMarkerColorA : 1.0
kLocalPlanningHorizonMarkerWidth : 0.3
kLocalPlanningHorizonHeight : 3.0
