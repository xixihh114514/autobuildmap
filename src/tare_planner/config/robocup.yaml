kKeyposeCloudDwzFilterLeafSize : 0.2
kRushHomeDist : 2.5
kAtHomeDistThreshold : 0.5
kTerrainCollisionThreshold : 0.5
kLookAheadDistance : 2.5
kUseMomentum : false
kDirectionChangeCounterThr : 6
kDirectionNoChangeCounterThr : 5
kResetWaypointJoystickAxesID : 2

# PlanningEnv
kUseFrontier : true
kFrontierClusterTolerance : 0.8
kFrontierClusterMinSize : 4
kUseCoverageBoundaryOnFrontier : false
kUseCoverageBoundaryOnObjectSurface : false

# Rolling occupancy grid
rolling_occupancy_grid/resolution_x : 0.15
rolling_occupancy_grid/resolution_y : 0.15
rolling_occupancy_grid/resolution_z : 0.15

kSurfaceCloudDwzLeafSize : 0.15
kCollisionCloudDwzLeafSize : 0.12
kKeyposeCloudStackNum : 5
kPointCloudRowNum : 40
kPointCloudColNum : 40
kPointCloudLevelNum : 20
kMaxCellPointNum : 100000
kPointCloudCellSize : 12
kPointCloudCellHeight : 1.8
kPointCloudManagerNeighborCellNum : 5
kCoverCloudZSqueezeRatio : 2.0

# KeyposeGraph
keypose_graph/kAddNodeMinDist : 0.5
keypose_graph/kAddNonKeyposeNodeMinDist : 0.25
keypose_graph/kAddEdgeConnectDistThr : 1.5
keypose_graph/kAddEdgeToLastKeyposeDistThr : 1.5
keypose_graph/kAddEdgeVerticalThreshold : 0.8
keypose_graph/kAddEdgeCollisionCheckResolution : 0.2
keypose_graph/kAddEdgeCollisionCheckRadius : 0.25
keypose_graph/kAddEdgeCollisionCheckPointNumThr : 1

# ViewPointManager
viewpoint_manager/number_x : 48
viewpoint_manager/number_y : 48
viewpoint_manager/number_z : 1
viewpoint_manager/resolution_x : 0.35
viewpoint_manager/resolution_y : 0.35
viewpoint_manager/resolution_z : 0.0
kConnectivityHeightDiffThr : 0.2
kGreedyViewPointSampleRange : 5
kLocalPathOptimizationItrMax : 12
kViewPointCollisionMargin : 0.18
kViewPointCollisionMarginZPlus : 0.25
kViewPointCollisionMarginZMinus : 0.25
kCollisionGridZScale : 1.0
kCollisionGridResolutionX : 0.12
kCollisionGridResolutionY : 0.12
kCollisionGridResolutionZ : 0.0
kCollisionPointThr : 1
kLineOfSightStopAtNearestObstacle : false
kViewPointHeightFromTerrain : 0.65
kViewPointHeightFromTerrainChangeThreshold : 0.4
kCheckDynamicObstacleCollision : false
kCollisionFrameCountMax : 2

kSensorRange : 5.5
kNeighborRange : 2.2
kCoverageOcclusionThr : 0.25
kCoverageDilationRadius : 0.15

# Grid World
kGridWorldXNum : 121
kGridWorldYNum : 121
kGridWorldZNum : 121
kGridWorldCellHeight : 3.0
kGridWorldNearbyGridNum : 5
kMinAddPointNumSmall : 12
kMinAddPointNumBig : 22
kMinAddFrontierPointNum : 3
kCellExploringToCoveredThr : 1
kCellCoveredToExploringThr: 2
kCellExploringToAlmostCoveredThr: 3
kCellAlmostCoveredToExploringThr: 5
kCellUnknownToExploringThr: 1

# Visualization
kExploringSubspaceMarkerColorGradientAlpha : true
kExploringSubspaceMarkerColorMaxAlpha : 0.8
kExploringSubspaceMarkerColorR : 0.0
kExploringSubspaceMarkerColorG : 1.0
kExploringSubspaceMarkerColorB : 0.0
kExploringSubspaceMarkerColorA : 1.0
kLocalPlanningHorizonMarkerColorR : 0.0
