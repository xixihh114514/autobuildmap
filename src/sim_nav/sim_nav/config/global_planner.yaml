# =====================================================
# 全局规划器（GlobalPlanner）参数配置文件
# 基于 A* 算法，适用于 move_base + TEB 局部规划
#目前更改quadratic 为true 原始为f,自由空间代价为65，原始为50
# =====================================================

GlobalPlanner:
  # ------------------- 规划器类型 -------------------
  planner_type: "global_planner/GlobalPlanner"
    # 规划器插件完整类名

  # ------------------- 核心算法开关 -------------------
  use_dijkstra: false
    # 是否使用 Dijkstra 算法
    # false → 使用 A*（更快、更智能）
    # true  → Dijkstra（更保守，但路径更长）

  use_grid_path: true # no可导
    # 是否启用“网格路径”模式
    # true  → 路径严格沿着栅格线（更可预测，但转角尖锐）
    # 建议：配合 use_quadratic: true 使用；若关闭 quadratic 则设为 false

  use_quadratic: true  # 可导
    # 是否使用二次函数近似代价（平滑路径）
    # true  → 路径更圆滑，适合 TEB 跟踪
    # false → 路径更“方”，但转角更尖锐
    # 【你已关闭】避免尖锐路径 → 推荐改为 true 获得更平滑路径！

  old_navfn_behavior: false
    # 是否使用旧版 navfn 行为（已废弃）
    # 必须为 false

  # ------------------- 代价权重 -------------------
  lethal_cost: 253
    # 致命障碍代价（0~255）
    # 253 是 costmap_2d 标准值（不可穿越）
    # 不要改！

  neutral_cost: 65
    # 自由空间代价（越小越倾向直线）
    # 50 是标准值，建议 50~70
    # 太小 → 路径贴墙；太大 → 绕路严重

  cost_factor: 4.0
    # 启发式函数权重（A* 的 h(n) 系数）
    # 越大 → 越接近最优路径，但计算慢
    # 越小 → 更快，但路径更“贪心”
    # 推荐：0.8 ~ 5.0（4.0 是平衡值）

  # ------------------- 目标容忍与未知区域 -------------------
  allow_unknown: false
    # 是否允许路径穿越未知区域（地图黑区）
    # false → 更安全（推荐！）
    # true  → 可能穿墙，适合已知地图

  default_tolerance: 0.5 # 增加以留出更多转弯空间
    # 目标点容忍半径（米）
    # 机器人到达此范围内即认为“到达目标”
    # 建议：0.1 ~ 0.5

  # ------------------- 路径发布与可视化 -------------------
  publish_potential: true
    # 是否发布势场图（用于 RViz 调试）
    # true  → 可视化 A* 代价场（推荐调试时打开）
    # false → 节省带宽

  # ------------------- 路径朝向优化（关键！）-------------------
  orientation_mode: 1
    # 路径点朝向插值模式
    # 0 = None（不插值，朝向跳变）
    # 1 = Forward（向前插值，推荐！）
    # 2 = Interpolate（双向插值）
    # 3 = ForwardThenInterpolate
    # 【推荐 1】：TEB 需要连续朝向，避免震荡

  orientation_window_size: 8
    # 朝向插值窗口大小（点数）
    # 越大 → 朝向变化越平滑
    # 建议：5 ~ 10
    # 配合 orientation_mode: 1 使用，防止转弯时机器人“抖动”

# =====================================================
# 调参建议（直角弯 + TEB 兼容）：
# 1. use_quadratic: true        → 路径更圆滑
# 2. orientation_mode: 1       → 朝向连续
# 3. default_tolerance: 0.3    → 给 TEB 转弯空间
# 4. use_grid_path: false      → 避免 90° 硬拐
# 5. cost_factor: 3.0          → 更优路径
# =====================================================