# =====================================================
# TEB 局部规划器（TebLocalPlannerROS）参数配置文件
# 适用于：差速轮机器人 + Gazebo + 边建图边导航 + 直角弯
# 文件路径：config/teb_local_planner_params.yaml
# =====================================================

TebLocalPlannerROS:

  # ==================== 1. 机器人运动学参数 ====================
  max_vel_x: 0.25
    # 前进最大线速度（m/s）
    # 0.25 → 安全精准，适合室内/狭窄环境
    # 建议：0.2 ~ 0.5

  max_vel_x_backwards: 0.15
    # 后退最大线速度（m/s）

  max_vel_theta: 2.0
    # 最大角速度（rad/s）≈ 114°/s
    # 足够应对直角弯快速转向
    # 建议：1.5 ~ 3.0

  acc_lim_x: 0.4
    # 线加速度限制（m/s²）
    # 0.4 → 平滑启动/制动，避免打滑
    # 建议：0.3 ~ 1.0

  acc_lim_theta: 3.0 #orange 1.5
    # 角加速度限制（rad/s²）
    # 确保转向平稳
    # 建议：1.0 ~ 3.0

  min_turning_radius: 0.0
    # 最小转弯半径（m）
    # 0.0 → 差速轮（原地旋转），全向轮可设 >0

  wheelbase: 0.438
    # 左右轮中心距（m）—— 仅用于 kinematic 模型
    # 若使用 footprint_model 可忽略

  cmd_angle_instead_rotvel: false
    # 是否输出角度指令而非角速度
    # false → 标准 Twist（推荐）

  # ==================== 2. 足迹模型（关键！）===================
  footprint_model:
    type: "polygon"
      # 足迹类型：polygon（多边形）或 circle/line/point
    vertices: [[0.335, 0.25], [0.335, -0.25], [-0.335, -0.25], [-0.335, 0.25]]
      # 机器人外轮廓顶点（单位：米）
      # 长 0.67m，宽 0.5m → 中心到边缘 0.335/0.25
      # 必须与 global/local_costmap 一致！

  # ==================== 3. 目标容差 ====================
  xy_goal_tolerance: 0.15
    # 位置目标容忍距离（m）
    # 0.15 → 到达目标点 ±15cm 即成功
    # 建议：0.1 ~ 0.3（直角弯可略大）

  yaw_goal_tolerance: 0.15
    # 朝向目标容忍角度（rad）≈ 8.6°
    # 建议：0.1 ~ 0.3

  free_goal_vel: false
    # 到达目标后是否允许自由速度（true=保持运动，false=停止）

  # ==================== 4. 轨迹生成与规划 ====================
  teb_autosize: true
    # 自动调整轨迹长度（推荐 true）

  dt_ref: 0.1
    # 轨迹时间步长（s）
    # 0.1 → 10Hz 轨迹更新，响应快
    # 建议：0.1 ~ 0.3

  dt_hysteresis: 0.05
    # 时间步长容忍范围（s）
    # 建议：dt_ref 的 10%~50%

  min_samples: 8
    # 轨迹最小点数
    # 8 → 短轨迹，响应快；建议 ≥5

  global_plan_overwrite_orientation: true
    # 是否用全局路径覆盖局部轨迹朝向
    # true → 更平滑，推荐！

  allow_init_with_backwards_motion: true
    # 是否允许后退初始化轨迹
    # true → 卡住时可后退重规划

  max_global_plan_lookahead_dist: 3.0
    # 局部规划最大前瞻距离（m）
    # 3.0 → 覆盖 local_costmap 一半，足够

  feasibility_check_no_poses: 5
    # 可行性检查的姿态数量
    # 5 → 平衡速度与安全性

  # ==================== 5. 障碍物避障 ====================
  min_obstacle_dist: 0.05 #原始0.1
    # 轨迹到障碍物最小距离（m）
    # 0.1 → 非常激进！建议 ≥0.3（配合 inflation）
    # 警告：太小会导致“擦边”失败

  include_dynamic_obstacles: true
    # 是否考虑动态障碍（需外部预测）

  inflation_dist: 0.3  #原始0.02
    # 代价地图膨胀区额外安全距离（m）
    # 0.02 → 极小！建议 ≥0.3
    # 警告：应与 costmap 的 inflation_radius 协调

  dynamic_obstacle_inflation_dist: 0.3 # 原始0.02
    # 动态障碍额外膨胀（m）
    # 同样建议 ≥0.3

  obstacle_poses_affected: 25
    # 每个障碍影响的轨迹点数
    # 25 → 合理，勿过大

  # ==================== 6. 优化权重（核心调参）===================
  no_inner_iterations: 5
    # 内层优化迭代次数
    # 5 → 平衡速度与精度

  no_outer_iterations: 4
    # 外层优化迭代次数

  optimization_activate: true
    # 启用优化（必须）

  optimization_verbose: false
    # 优化日志（调试用）

  penalty_epsilon: 0.1
    # 目标点惩罚容忍（m）

  weight_max_vel_x: 2
    # 违反线速度惩罚权重

  weight_max_vel_theta: 1
    # 违反角速度惩罚权重

  weight_acc_lim_x: 1
    # 违反线加速度惩罚

  weight_acc_lim_theta: 1
    # 违反角加速度惩罚

  weight_kinematics_nh: 1000 #原1500
    # 非完整约束惩罚（差速轮必须高！）
    # 1500 → 强制满足运动学

  weight_kinematics_forward_drive: 1
    # 前进优先（1=轻微鼓励前进）

  weight_optimaltime: 1.5 #原2 如果还想再平滑可以再减小
    # 时间最优权重（越小越慢但平滑）

  weight_obstacle: 20
    # 避障权重
    # 20 → 适中；建议 20~50

  weight_inflation: 1.0 #原始0.1
    # 膨胀区代价权重
    # 0.1 → 很低！建议 1.0~5.0（否则贴墙）

  weight_dynamic_obstacle: 10
    # 动态障碍权重

  weight_viapoint: 20.0
    # 跟随全局路径权重
    # 20 → 强跟随，防止偏离

  # ==================== 7. 震荡恢复 ====================
  oscillation_recovery: true # 保持不变
    # 启用震荡恢复（卡住时旋转）

  oscillation_v_eps: 0.3
    # 线速度震荡阈值（m/s）

  oscillation_omega_eps: 0.3
    # 角速度震荡阈值（rad/s）

  oscillation_recovery_min_duration: 10
    # 恢复动作最小持续时间（s）

  oscillation_filter_duration: 10
    # 震荡检测滤波时间（s）

  # ==================== 8. 同伦类规划（多路径选择）===================
  enable_homotopy_class_planning: true
    # 启用同伦类规划（多条可行路径）
    # true → 更鲁棒，适合复杂环境

  enable_multithreading: true
    # 多线程加速

  simple_exploration: false
    # 简单探索模式（不推荐）

  max_number_classes: 4
    # 最大路径类数
    # 4 → 足够，勿过多（耗时）

  selection_cost_hysteresis: 1.0
    # 路径切换滞后系数

  selection_obst_cost_scale: 50.0
    # 障碍代价缩放（选择最优路径）

  selection_alternative_time_cost: false
    # 是否考虑时间代价

  roadmap_graph_no_samples: 15
    # 路图采样点数

  roadmap_graph_area_width: 6
    # 路图搜索宽度（m）

  h_signature_prescaler: 0.5
    # 同伦签名缩放

  h_signature_threshold: 0.1
    # 同伦类区分阈值

  obstacle_heading_threshold: 0.45
    # 障碍朝向变化阈值（rad）≈ 26°
    # 用于动态障碍方向判断