# =====================================================
# DWA 局部规划器参数配置
# 适用于：履带机器人 + 探索导航
# =====================================================

DWAPlannerROS:

  # ==================== 1. 机器人运动学参数 ====================
  max_vel_x: 0.3
    # 最大前进速度 (m/s)
    # 履带机器人建议：0.2 ~ 0.4

  max_vel_x_backwards: 0.15
    # 最大后退速度 (m/s)

  max_vel_theta: 1.5
    # 最大角速度 (rad/s)
    # 履带机器人建议：1.0 ~ 2.0

  acc_lim_x: 0.5
    # 线加速度限制 (m/s²)
    # 履带机器人建议：0.3 ~ 0.8（防打滑）

  acc_lim_theta: 2.0
    # 角加速度限制 (rad/s²)
    # 履带机器人建议：1.5 ~ 3.0

  # ==================== 2. 轨迹采样参数 ====================
  vx_samples: 20
    # X 方向速度采样数量
    # 建议：15 ~ 30

  vtheta_samples: 40
    # 角速度采样数量
    # 建议：30 ~ 50

  sim_time: 1.5
    # 轨迹仿真时间 (秒)
    # 建议：1.0 ~ 2.0

  sim_granularity: 0.025
    # 轨迹仿真粒度 (米)
    # 建议：0.02 ~ 0.05

  # ==================== 3. 评价函数权重 ====================
  path_distance_bias: 32.0
    # 路径对齐权重
    # 调大：更贴近全局路径
    # 建议：20 ~ 50

  goal_distance_bias: 24.0
    # 目标距离权重
    # 调大：更激进地接近目标
    # 建议：15 ~ 40

  occdist_bias: 0.01
    # 障碍物距离权重
    # 调大：更保守避障
    # 建议：0.01 ~ 0.1

  forward_point_distance: 0.325
    # 前向点距离 (米)
    # 用于计算路径对齐

  stop_time_buffer: 0.2
    # 停止时间缓冲 (秒)
    # 建议：0.1 ~ 0.5

  scaling_speed: 0.25
    # 速度缩放阈值 (m/s)
    # 低于此速度时开始缩放

  max_scaling_factor: 0.2
    # 最大缩放因子

  # ==================== 4. 避障参数 ====================
  oscillation_reset_dist: 0.05
    # 振荡重置距离 (米)
    # 机器人移动此距离后重置振荡计数器

  oscillation_reset_angle: 0.785
    # 振荡重置角度 (弧度)
    # 机器人旋转此角度后重置振荡计数器

  # ==================== 5. 目标容差 ====================
  xy_goal_tolerance: 0.15
    # 位置目标容忍距离 (米)

  yaw_goal_tolerance: 0.5
    # 朝向目标容忍角度 (弧度)

  latch_xy_goal_tolerance: false
    # 是否锁定位置容忍（true=到达后不再检查位置）

  # ==================== 6. 其他参数 ====================
  prune_plan: true
    # 是否修剪全局路径（删除已走过的部分）

  publish_cost_grid_pc: false
    # 是否发布代价网格点云（调试用）

  publish_traj_pc: false
    # 是否发布轨迹点云（调试用）

  controller_frequency: 10.0
    # 控制器频率 (Hz)
